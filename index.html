<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentencja na wieczór</title>
    <!-- Ładowanie Tailwind CSS do łatwego i czystego stylowania -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Własna czcionka dla nowoczesnego wyglądu */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen p-4">

    <div class="max-w-xl w-full bg-white p-8 sm:p-12 rounded-xl shadow-2xl text-center">
        <h1 class="text-4xl font-bold text-gray-800 mb-6">
            Oto i sentencja na nasz wieczór
        </h1>
        
        <!-- Obszar wyświetlania słowa, początkowo ustawiony na "Ładowanie..." -->
        <div id="word-display" 
             class="min-h-[4rem] text-5xl sm:text-7xl font-extrabold text-indigo-600 
                    my-10 transition-transform duration-300 ease-out select-text">
            Ładowanie...
        </div>

        <p id="status-message" class="mt-4 text-sm text-gray-500">AI pomogło...</p>
    </div>

    <script>
        const display = document.getElementById('word-display');
        
        /**
         * Pobiera losowe słowo z funkcji Netlify Serverless.
         */
        async function fetchWord() {
            // Dodanie efektu ładowania (rozmycie i przyciemnienie)
            display.classList.add('opacity-50', 'blur-sm');

            // Prawidłowa ścieżka względna do funkcji Netlify
            const functionUrl = '.netlify/functions/random-word';

            try {
                // Wywołanie funkcji
                const response = await fetch(functionUrl);
                const data = await response.json();
                
                if (response.ok && data.word) {
                    display.innerText = data.word;
                } else {
                    display.innerText = "Błąd!";
                    console.error("Błąd funkcji:", data.error || 'Nie udało się pobrać danych.');
                }

            } catch (error) {
                console.error("Błąd pobierania:", error);
                display.innerText = "Błąd sieci!";
            } finally {
                // Usunięcie efektu ładowania
                display.classList.remove('opacity-50', 'blur-sm');
            }
        }

        // --- Wykonanie natychmiast po załadowaniu strony ---
        // Uruchomienie funkcji pobierającej słowo natychmiast po załadowaniu wszystkich elementów strony.
        window.onload = fetchWord;
    </script>
</body>
</html>
